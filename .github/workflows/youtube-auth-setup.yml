name: YouTube Auth Setup (one-time, manual)

on:
  workflow_dispatch:

jobs:
  device-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Write client_secret.json from secret
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Verify client_secret.json
        run: |
          python -c "import json;print(json.load(open('client_secret.json')).keys())"

      - name: Run device-flow auth
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u youtube_auth_setup.py

      - name: Show device code file
        if: always()
        run: |
          echo "========== DEVICE CODE =========="
          if [ -f device_code.txt ]; then
            cat device_code.txt
          else
            echo "device_code.txt not found"
          fi
          echo "================================"

      - name: Upload device code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-code
          path: device_code.txt
          if-no-files-found: warn

      - name: Print token.json
        if: always()
        run: |
          if [ -f token.json ]; then
            echo "========== TOKEN.JSON =========="
            cat token.json
            echo ""
            echo "================================"
          else
            echo "token.json not created yet."
          fi

      - name: Upload token.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-token
          path: token.json
          if-no-files-found: warn
