name: YouTube Auth Setup (one-time, manual)

on:
  workflow_dispatch: {}

jobs:
  device-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Write client_secret.json from secret
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Verify client_secret.json
        run: |
          echo "========== CLIENT SECRET =========="
          ls -l client_secret.json
          python -c "import json; d=json.load(open('client_secret.json')); print(d)"
          echo "==================================="

      - name: Run device-flow auth (watch this step's log for the URL + code)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u youtube_auth_setup.py

      - name: Print token.json (copy this into the YOUTUBE_TOKEN_JSON secret)
        run: |
          echo "========== TOKEN.JSON =========="
          cat token.json
          echo ""
          echo "================================"
